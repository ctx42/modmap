  .module{transition:opacity .15s ease-out;cursor:pointer;}
  .module rect{pointer-events:all;}
  .module:focus{outline:none;}
  .module:focus rect{stroke-dasharray:none;}
  .badge{visibility:hidden;}
  svg:has(.module:hover) .module,svg:has(.module:focus) .module{opacity:0.12;}
  svg:not(:has(.module:focus)):has(#m0:hover) #m0,svg:not(:has(.module:focus)):has(#m0:hover) .rm0,svg:has(#m0:focus) #m0,svg:has(#m0:focus) .rm0{opacity:1;}
